name: Dynamic Ephemeris Generation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude station'
        required: true
        default: '43.284356'
      lon:
        description: 'Longitude station'
        required: true
        default: '5.358507'
      alt:
        description: 'Altitude (mètres)'
        required: true
        default: '99.31'

permissions:
  contents: write

jobs:
  generate-ephemeris:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield numpy

      - name: Run DE440s Topocentric Extractor
        env:
          LAT: ${{ inputs.lat || vars.STATION_LAT || '43.284356' }}
          LON: ${{ inputs.lon || vars.STATION_LON || '5.358507' }}
          ALT: ${{ inputs.alt || vars.STATION_ALT || '99.31' }}
        run: |
          python dynamic_multiphysics_engine.py "$LAT" "$LON" "$ALT"

      - name: Validate Generated JSON
        run: |
          test -s flux_live.json || (echo "[ERROR] flux_live.json est vide !" && exit 1)

      - name: Commit and Push flux_live.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json
          git commit -m "Update DE440s topocentric flux_live.json [skip ci]" || exit 0
          git push
