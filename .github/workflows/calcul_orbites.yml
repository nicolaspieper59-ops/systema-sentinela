name: Noyau Déterministe DE440s

on:
  schedule:
    - cron: '0 * * * *' # CORRECTION : 1 fois par heure, pile à l'heure (évite le ban GitHub)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4

    - name: Génération dynamique des prérequis
      run: |
        echo "numpy" > requirements.txt
        echo "skyfield" >> requirements.txt

    - name: Configuration de Python & Mise en Cache Pip
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Gestion du Cache pour l'Éphéméride de440s.bsp
      id: cache-bsp
      uses: actions/cache@v4
      with:
        path: de440s.bsp
        key: bsp-de440s-v1

    - name: Exécution du Moteur Déterministe
      run: |
        python dynamic_multiphysics_engine.py 43.284356 5.358507 99.3100 15.0

    - name: Commit et Push des résultats
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add flux_live.json
        if ! git diff-index --quiet HEAD --; then
          git commit -m "Actualisation horaire UTC matrice d'état [CI]"
          git push
        else
          echo "Aucune variation détectée."
        fi
