name: Dynamic Ephemeris Generation & WASM Compilation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude station'
        required: true
        default: '43.284356'
      lon:
        description: 'Longitude station'
        required: true
        default: '5.358507'
      alt:
        description: 'Altitude (mètres)'
        required: true
        default: '99.31'

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield numpy

      - name: 🛰️ Télécharger le noyau DE440s depuis le serveur NASA/NAIF
        run: |
          curl -O https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp

      - name: Run DE440s Topocentric Extractor
        env:
          LAT: ${{ inputs.lat || vars.STATION_LAT || '43.284356' }}
          LON: ${{ inputs.lon || vars.STATION_LON || '5.358507' }}
          ALT: ${{ inputs.alt || vars.STATION_ALT || '99.31' }}
        run: |
          python dynamic_multiphysics_engine.py "$LAT" "$LON" "$ALT"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Compile C++ to WebAssembly
        run: |
          emcc src/wasm_astronomie.cpp -o wasm_astronomie.js \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS='["_calculerParametresSiderauxEtSolaires", "_calculerDepuisECEF", "_calculerPositionTopocentrique", "_malloc", "_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["HEAPF64", "HEAP32"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -O3

      - name: Validate Generated Files
        run: |
          test -s flux_live.json || (echo "[ERROR] flux_live.json est vide !" && exit 1)
          test -s wasm_astronomie.wasm || (echo "[ERROR] wasm_astronomie.wasm est vide !" && exit 1)

      - name: Commit and Push Assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json wasm_astronomie.js wasm_astronomie.wasm
          git commit -m "Auto-update DE440s flux and compile WebAssembly binaries [skip ci]" || exit 0
          git push
