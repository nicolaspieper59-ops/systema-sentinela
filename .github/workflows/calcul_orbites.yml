- name: Téléchargement ou Cache de l'éphéméride de440s.bsp
      uses: actions/cache@v4
      with:
        path: de440s.bsp
        key: bsp-de440s-v3

    - name: Vérification et Téléchargement de secours DE440s
      run: |
        if [ ! -f "de440s.bsp" ]; then
          echo "Téléchargement de l'éphéméride DE440s..."
          curl -L -o de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp || true
        fi

    - name: Exécution du Moteur Topocentrique
      run: |
        python dynamic_multiphysics_engine.py 38.7317 -9.1448 0.137 15.0

    - name: Commit et Push Sécurisé
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add flux_live.json
        if ! git diff-index --quiet HEAD --; then
          git commit -m "Actualisation automatique de flux_live.json [CI]"
          git push origin main || git push
        else
          echo "Aucune variation détectée."
        fi
