name: Dynamic Ephemeris Generation

on:
  schedule:
    - cron: '0 0 * * *'  # Exécution quotidienne à minuit UTC
  workflow_dispatch:      # Permet de lancer le workflow manuellement depuis GitHub

jobs:
  generate-ephemeris:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield numpy

      - name: Download DE440s Kernel (Fast Mirror with Timeout)
        run: |
          if [ ! -f "de440s.bsp" ]; then
            echo "Téléchargement accéléré de de440s.bsp..."
            curl --connect-timeout 15 --max-time 60 -k -SL -A "Mozilla/5.0" -o de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp || true
          fi

      - name: Run DE440s Topocentric Extractor
        run: |
          python dynamic_multiphysics_engine.py 38.7317 -9.1448 137.0

      - name: Commit and Push flux_live.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json
          git commit -m "Update DE440s topocentric flux_live.json [skip ci]" || exit 0
          git push
