name: Pipeline Ephemerides DE440s & Wasm Build (SOFA IAU Integrated)

concurrency:
  group: pages-build-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 2 * * *' # Exécution quotidienne à 02:00 UTC
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'dynamic_multiphysics_engine.py'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude station'
        required: true
        default: '43.284356'
      lon:
        description: 'Longitude station'
        required: true
        default: '5.358507'
      alt:
        description: 'Altitude orthométrique (mètres)'
        required: true
        default: '49.81'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install spiceypy numpy skyfield scipy

      - name: ⚙️ Configurer Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: 'emsdk-cache'

      - name: 🛰️ Cache du noyau DE440s
        uses: actions/cache@v4
        with:
          path: de440s.bsp
          key: de440s-bsp-v1

      - name: 📥 Téléchargement & Vérification des données (DE440s & WMM2025)
        run: |
          if [ ! -f "de440s.bsp" ] || [ $(wc -c < de440s.bsp) -lt 10000000 ]; then
            echo "Téléchargement du noyau de440s.bsp..."
            curl -fsSL --connect-timeout 20 --retry 3 -o de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp || \
            curl -fsSL --connect-timeout 20 --retry 3 -o de440s.bsp https://raw.githubusercontent.com/skyfielders/astronomy-data/main/de440s.bsp
          fi
          test -s de440s.bsp || { echo "ERREUR CRITIQUE : de440s.bsp invalide ou manquant"; exit 1; }

          if [ -f "src/WMM2025.COF" ]; then
            cp -f src/WMM2025.COF ./WMM2025.COF
          elif [ ! -f "WMM2025.COF" ] || [ $(wc -c < WMM2025.COF) -lt 1000 ]; then
            echo "Téléchargement de WMM2025.COF..."
            curl -fsSL --connect-timeout 20 --retry 3 -o WMM2025.COF https://www.ngdc.noaa.gov/geomag/WMM/data/WMM2025/WMM2025.COF
          fi
          test -s WMM2025.COF || { echo "ERREUR CRITIQUE : WMM2025.COF introuvable ou vide"; exit 1; }

      - name: 🌍 Exécution de l'extracteur multiphysique (Fenêtre 7 Jours)
        env:
          LAT: ${{ github.event.inputs.lat || vars.STATION_LAT || '43.284356' }}
          LON: ${{ github.event.inputs.lon || vars.STATION_LON || '5.358507' }}
          ALT: ${{ github.event.inputs.alt || vars.STATION_ALT || '49.81' }}
        run: |
          python dynamic_multiphysics_engine.py "$LAT" "$LON" "$ALT" --days 7 --out flux_live.json

      - name: 🔍 Audit & Validation physique du flux généré
        run: |
          python -c "
          import json, sys

          try:
              with open('flux_live.json', 'r') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'ERREUR: Fichier JSON corrompu : {e}')
              sys.exit(1)

          payload = data.get('DATA') or data.get('corps')
          if not payload:
              print('ERREUR CRITIQUE: Clé de données absente du flux.')
              sys.exit(1)

          if len(payload) == 0:
              print('ERREUR CRITIQUE: Le flux produit est vide.')
              sys.exit(1)

          print(f'Validation réussie : {len(payload)} enregistrements vérifiés.')
          "

      - name: 📂 Extraction & Préparation de la bibliothèque SOFA C
        run: |
          mkdir -p lib/sofa/src
          if [ -f "src.zip" ]; then
            unzip -q -o src.zip -d lib/sofa/tmp_extract/
            SOFA_DIR=$(find lib/sofa/tmp_extract/ -name "sofa.h" -exec dirname {} \;)
            if [ -n "$SOFA_DIR" ]; then
              cp -r "$SOFA_DIR"/* lib/sofa/src/
              rm -rf lib/sofa/tmp_extract/
            fi
          elif [ -f "lib/sofa/src.zip" ]; then
            unzip -q -o lib/sofa/src.zip -d lib/sofa/tmp_extract/
            SOFA_DIR=$(find lib/sofa/tmp_extract/ -name "sofa.h" -exec dirname {} \;)
            if [ -n "$SOFA_DIR" ]; then
              cp -r "$SOFA_DIR"/* lib/sofa/src/
              rm -rf lib/sofa/tmp_extract/
            fi
          else
            echo "ERREUR CRITIQUE : Fichier src.zip introuvable sur le dépôt."
            exit 1
          fi

          test -f "lib/sofa/src/sofa.h" || { echo "ERREUR CRITIQUE : sofa.h introuvable après extraction."; exit 1; }

      - name: 🔨 Compilation C++ & SOFA vers WebAssembly (Wasm)
        run: |
          SRC_FILE="src/astro_engine.cpp"
          if [ ! -f "$SRC_FILE" ] && [ -f "src/wasm_astronomie.cpp" ]; then
            SRC_FILE="src/wasm_astronomie.cpp"
          elif [ ! -f "$SRC_FILE" ] && [ -f "astro_engine.cpp" ]; then
            SRC_FILE="astro_engine.cpp"
          fi

          if [ ! -f "$SRC_FILE" ]; then
            echo "ERREUR CRITIQUE : Aucun fichier source C++ trouvé pour le binaire WASM."
            exit 1
          fi

          echo "1/2 - Compilation des objets C de SOFA..."
          mkdir -p build_sofa
          for f in lib/sofa/src/*.c; do
            emcc -c "$f" -O3 -I lib/sofa/src -o "build_sofa/$(basename ${f%.c}.o)"
          done

          echo "2/2 - Compilation finale C++ et linkage WebAssembly..."
          em++ "$SRC_FILE" build_sofa/*.o -O3 -std=c++17 \
            -I lib/sofa/src \
            -s WASM=1 \
            -s FORCE_FILESYSTEM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=33554432 \
            -s EXPORTED_FUNCTIONS="['_calculerParametresSiderauxEtSolaires','_calculerDepuisECEF','_normaliserDegres','_malloc','_free']" \
            -s EXPORTED_RUNTIME_METHODS="['ccall','cwrap','HEAPF64','HEAP32','getValue','setValue']" \
            -o wasm_astronomie.js

      - name: 🔖 Horodatage du Cache PWA
        run: |
          DATE_CACHE=$(date +'%Y%m%d%H%M')
          if [ -f "sw.js" ]; then
            sed -i -E "s/(const|let|var)\s+CACHE_NAME\s*=.*/const CACHE_NAME = 'sentinela-cache-$DATE_CACHE';/" sw.js
          fi

      - name: 📦 Préparation de l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
