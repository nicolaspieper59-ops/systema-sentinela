name: Compilation C++ Wasm et Déploiement PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield numpy

      - name: Compile C++ to WebAssembly
        run: |
          # Recherche dynamique du fichier C++ dans src/
          CPP_FILE=$(find src/ -maxdepth 1 -name "*.cpp" | head -n 1)
          
          if [ -n "$CPP_FILE" ]; then
            echo "Fichier source trouvé : $CPP_FILE"
            emcc "$CPP_FILE" -O3 -std=c++17 \
              -s WASM=1 \
              -s FORCE_FILESYSTEM=1 \
              -s ALLOW_MEMORY_GROWTH=1 \
              -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
              -o wasm_astronomie.js
          else
            echo "Aucun fichier C++ trouvé dans src/, création d'un module Wasm stub..."
            echo 'extern "C" { double status() { return 1.0; } }' > temp.cpp
            emcc temp.cpp -O3 -s WASM=1 -o wasm_astronomie.js
          fi

      - name: Download DE440s Kernel (Fallback)
        run: |
          if [ ! -f "de440s.bsp" ]; then
            echo "Téléchargement direct du fichier de440s.bsp..."
            curl -s -L -o de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp || true
          fi

      - name: Generate Ephemeris Data
        run: |
          python dynamic_multiphysics_engine.py 38.7317 -9.1448 137.0

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json wasm_astronomie.js wasm_astronomie.wasm 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "Aucun changement détecté."
          else
            git commit -m "Build Wasm & Update DE440s flux_live.json [skip ci]"
            git push origin main
          fi
