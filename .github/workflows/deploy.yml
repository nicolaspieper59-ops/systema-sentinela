name: Compilation C++ Wasm et Déploiement PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield numpy

      - name: Build WebAssembly Module
        run: |
          echo "=== Lancement Emscripten ==="
          emcc src/astro_engine.cpp -O2 -std=c++17 \
            -s WASM=1 \
            -s FORCE_FILESYSTEM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o wasm_astronomie.js

      - name: Download JPL Kernel
        run: |
          python -c "from skyfield.api import load; load('de440s.bsp')" || true

      - name: Generate Ephemeris
        run: |
          python dynamic_multiphysics_engine.py 38.7317 -9.1448 137.0

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json wasm_astronomie.js wasm_astronomie.wasm 2>/devnull || true
          
          if git diff --staged --quiet; then
            echo "Aucun fichier modifié."
          else
            git commit -m "Build Wasm & Update DE440s flux_live.json [skip ci]"
            git push origin main
          fi          
          if git diff --staged --quiet; then
            echo "Aucun fichier modifié à pousser."
          else
            git commit -m "Build Wasm & Update DE440s flux_live.json [skip ci]"
            git push origin main
          fi
