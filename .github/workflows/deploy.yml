name: Pipeline Ephemerides DE440s & Wasm Build (SOFA IAU Integrated)

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - '*.cpp'
      - '*.js'
      - '*.html'
      - 'dynamic_multiphysics_engine.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install spiceypy numpy skyfield scipy requests

      - name: ⚙️ Configurer Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: 'emsdk-cache'

      - name: 🛰️ Cache du noyau DE440s
        uses: actions/cache@v4
        with:
          path: de440s.bsp
          key: de440s-bsp-kernel-v1

      - name: 📥 Téléchargement & Vérification des données
        run: |
          if [ ! -f "de440s.bsp" ] || [ $(wc -c < de440s.bsp) -lt 10000000 ]; then
            curl -fsSL --connect-timeout 20 --retry 3 -o de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp || \
            curl -fsSL --connect-timeout 20 --retry 3 -o de440s.bsp https://raw.githubusercontent.com/skyfielders/astronomy-data/main/de440s.bsp
          fi
          if [ -f "src/WMM2025.COF" ]; then
            cp -f src/WMM2025.COF ./WMM2025.COF
          elif [ ! -f "WMM2025.COF" ] || [ $(wc -c < WMM2025.COF) -lt 1000 ]; then
            curl -fsSL --connect-timeout 20 --retry 3 -o WMM2025.COF https://www.ngdc.noaa.gov/geomag/WMM/data/WMM2025/WMM2025.COF
          fi
          curl -fsSL --connect-timeout 20 --retry 3 -o finals2000A.all https://datacenter.iers.org/data/latestVersion/finals2000A.all || true

      - name: 🌍 Exécution de l'extracteur multiphysique Python (Haute Résolution 7 Jours)
        run: |
          python dynamic_multiphysics_engine.py "43.284356" "5.358507" "49.81" --days 7 --out flux_live.json

      - name: 📂 Préparation de la bibliothèque SOFA C / ERFA
        run: |
          rm -rf lib/sofa
          mkdir -p lib/sofa/src
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch v2.0.1.1 https://github.com/liberfa/erfa.git lib/sofa_repo || \
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 https://github.com/liberfa/erfa.git lib/sofa_repo
          cp -r lib/sofa_repo/src/* lib/sofa/src/
          rm -rf lib/sofa_repo
          
          if [ -f "lib/sofa/src/erfa.h" ]; then
            cat << 'EOF' > lib/sofa/src/sofa.h
          #include "erfa.h"
          #define iauObl06 eraObl06
          #define iauGst06a eraGst06a
          #define iauAb eraAb
          #define iauRefco eraRefco
          #define iauC2t06a eraC2t06a
          #define iauC2i06a eraC2i06a
          #define iauEo06a eraEo06a
          #define iauEra00 eraEra00
          #define iauLd eraLd
          EOF
          fi
          
          if [ -f "lib/sofa/src/erfam.h" ]; then
            echo '#include "erfam.h"' > lib/sofa/src/sofam.h
          else
            touch lib/sofa/src/sofam.h
          fi

      - name: 🔨 Compilation C++ & SOFA vers WebAssembly (Wasm)
        run: |
          if [ -f "astro_engine.cpp" ]; then
            SRC_FILE="astro_engine.cpp"
          elif [ -f "src/astro_engine.cpp" ]; then
            SRC_FILE="src/astro_engine.cpp"
          else
            echo "[ERREUR FATAL] Impossible de trouver astro_engine.cpp"
            exit 1
          fi
          
          mkdir -p build_sofa
          for f in lib/sofa/src/*.c; do
            [ -f "$f" ] || continue
            [[ "$f" == *"erfaversion.c"* || "$f" == *"/t_"* ]] && continue
            emcc -c "$f" -O3 -I lib/sofa/src -I src/ -o "build_sofa/$(basename ${f%.c}.o)"
          done
          em++ "$SRC_FILE" build_sofa/*.o -O3 -std=c++17 \
            -I lib/sofa/src -I src/ \
            -s WASM=1 -s FORCE_FILESYSTEM=1 -s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=33554432 \
            -s EXPORTED_FUNCTIONS="['_calculerParametresSiderauxEtSolaires','_calculerDepuisECEF','_evaluerOccultationsEtEclipses','_calculerOndulationGeoideEGM','_normaliserDegres','_eraEra00','_malloc','_free']" \
            -s EXPORTED_RUNTIME_METHODS="['ccall','cwrap','HEAPF64','HEAP32','getValue','setValue']" \
            -o wasm_astronomie.js

      - name: 📂 Assemblage du site Web & Préparation de l'artefact
        run: |
          mkdir -p public_site
          cp -f index.html manifest.json sw.js worker.js three.min.js public_site/ 2>/dev/null || true
          cp -rf textures public_site/ 2>/dev/null || true
          cp -f EGM2008.gfc public_site/ 2>/dev/null || true
          cp -f flux_live.json wasm_astronomie.js wasm_astronomie.wasm public_site/ 2>/dev/null || true
          cp -f WMM2025.COF public_site/ 2>/dev/null || true

      - name: 🔄 Synchronisation propre du dépôt distant (Stash & Rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "temp-wasm-build"
          git pull origin main --rebase || git pull origin master --rebase || true
          git stash pop || true

      - name: 📌 Mettre à jour les binaires Wasm dans le dépôt principal
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(wasm): mise à jour automatique des binaires Wasm compilés [skip ci]"
          file_pattern: "wasm_astronomie.wasm wasm_astronomie.js"

      - name: 🔀 Créer une Pull Request automatique pour flux_live.json
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ACTIONS_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "Mise à jour automatique du flux live journalier [skip ci]"
          title: "🤖 Mise à jour automatique de flux_live.json"
          body: "Mise à jour automatique de flux_live.json par le pipeline cron."
          branch: update-flux-live
          delete-branch: true
          base: main
          add-paths: |
            flux_live.json

      - name: 📦 Préparation de l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'public_site'

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
