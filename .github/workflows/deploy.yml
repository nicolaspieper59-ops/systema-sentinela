name: Compilation C++ Wasm et Déploiement PWA

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt Git
        uses: actions/checkout@v4

      - name: Installation du SDK Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Compilation C++ vers Wasm
        run: |
          mkdir -p build
          emcc src/astro_engine.cpp -O3 \
            -s WASM=1 \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","getValue","_malloc","_free"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -o build/astro_engine.js

      - name: Copie Intégrale des Ressources du Dépôt
        run: |
          cp index.html build/
          cp manifest.json build/
          cp sw.js build/
          cp *.js build/ 2>/dev/null || true
          cp *.json build/ 2>/dev/null || true
          cp *.COF build/ 2>/dev/null || true
          cp *.csv build/ 2>/dev/null || true

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v4

      - name: Publication de l'Artefact Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
