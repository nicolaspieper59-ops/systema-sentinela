name: Compilation C++ Wasm et Déploiement PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield numpy

      - name: Step 1 - Build Wasm
        run: |
          emcc src/astro_engine.cpp -O3 -std=c++17 \
            --no-entry \
            -s WASM=1 \
            -s FORCE_FILESYSTEM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_FUNCTIONS='["_calculerDepuisECEF","_calculerPositionTopocentrique","_main"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o wasm_astronomie.js

      - name: Step 2 - Download Ephemeris Kernel
        run: |
          if [ ! -f "de440s.bsp" ]; then
            curl -k -SL -A "Mozilla/5.0" -o de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp || true
          fi

      - name: Step 3 - Run Ephemeris Engine
        run: |
          python dynamic_multiphysics_engine.py 38.7317 -9.1448 137.0

      - name: Step 4 - Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json wasm_astronomie.js wasm_astronomie.wasm 2>/devnull || true
          if git diff --staged --quiet; then
            echo "Aucune modification à commiter."
          else
            git commit -m "Build Wasm & Update DE440s flux_live.json [skip ci]"
            git push origin main
          fi
