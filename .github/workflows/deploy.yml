name: Compilation C++ Wasm et Déploiement PWA

on:
  schedule:
    - cron: '0 0 * * *'   # Régénération quotidienne à 00:00 UTC
  push:
    branches: [ main ]     # Exécution à chaque push sur main
  workflow_dispatch:      # Permet le lancement manuel
    inputs:
      lat:
        description: 'Latitude station'
        required: true
        default: '43.284356'
      lon:
        description: 'Longitude station'
        required: true
        default: '5.358507'
      alt:
        description: 'Altitude (mètres)'
        required: true
        default: '99.31'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield numpy

      - name: Build WebAssembly Module
        run: |
          emcc src/astro_engine.cpp -O3 -std=c++17 \
            -s WASM=1 \
            -s FORCE_FILESYSTEM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_FUNCTIONS='["_calculerDepuisECEF","_calculerPositionTopocentrique"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o wasm_astronomie.js

      - name: Run DE440s Topocentric Extractor
        env:
          LAT: ${{ inputs.lat || vars.STATION_LAT || '43.284356' }}
          LON: ${{ inputs.lon || vars.STATION_LON || '5.358507' }}
          ALT: ${{ inputs.alt || vars.STATION_ALT || '99.31' }}
        run: |
          python build_ephemerides.py "$LAT" "$LON" "$ALT"

      - name: Validate Generated JSON
        run: |
          test -s flux_live.json || (echo "[ERROR] flux_live.json est vide ou manquant !" && exit 1)

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json wasm_astronomie.js wasm_astronomie.wasm worker_astronomie.js 2>/devnull || true
          if git diff --staged --quiet; then
            echo "Aucune modification à commiter."
          else
            git commit -m "Build Wasm & Update DE440s flux_live.json [skip ci]"
            git push origin main
          fi
