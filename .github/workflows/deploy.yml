name: Compilation C++ Wasm et Déploiement PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield

      - name: Build WebAssembly Module
        run: |
          # Compilation du fichier C++ situé dans le dossier src/
          if [ -f "src/astro_engine.cpp" ]; then
            emcc src/astro_engine.cpp -O3 -s WASM=1 -s FORCE_FILESYSTEM=1 -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' -o wasm_astronomie.js
          else
            echo "Erreur : src/astro_engine.cpp est introuvable."
            exit 1
          fi

      - name: Generate Live Ephemeris (DE440s)
        run: |
          python dynamic_multiphysics_engine.py 38.7317 -9.1448 137.0

      - name: Commit and Push Updated Artifacts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json wasm_astronomie.js wasm_astronomie.wasm 2>/dev/null || true
          git commit -m "Build Wasm (astro_engine.cpp) & Update DE440s flux_live.json [skip ci]" || exit 0
          git push
