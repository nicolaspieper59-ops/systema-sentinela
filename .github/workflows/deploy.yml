name: Compilation C++ Wasm et Déploiement PWA

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude station'
        required: false
        default: '43.284356'
      lon:
        description: 'Longitude station'
        required: false
        default: '5.358507'
      alt:
        description: 'Altitude (mètres)'
        required: false
        default: '99.31'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield numpy

      - name: Cache DE440s Kernel
        uses: actions/cache@v4
        with:
          path: de440s.bsp
          key: de440s-bsp-v1

      - name: Download DE440s Kernel
        run: |
          if [ ! -f "de440s.bsp" ] || [ $(wc -c < de440s.bsp) -lt 10000000 ]; then
            echo "Téléchargement du noyau DE440s..."
            curl -sSL --connect-timeout 20 --retry 3 -o de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp || \
            curl -sSL --connect-timeout 20 --retry 3 -o de440s.bsp https://raw.githubusercontent.com/skyfielders/astronomy-data/main/de440s.bsp
          fi
          test -s de440s.bsp || (echo "[ERREUR CRITIQUE] Fichier de440s.bsp invalide" && exit 1)

      - - name: Build WebAssembly Module
        run: |
          emcc src/astro_engine.cpp -O3 -std=c++17 \
            -s WASM=1 \
            -s FORCE_FILESYSTEM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_FUNCTIONS='["_calculerParametresSiderauxEtSolaires","_calculerDepuisECEF","_calculerPositionTopocentrique","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","HEAPF64","HEAP32"]' \
            -o wasm_astronomie.js

      - name: Run DE440s Topocentric Extractor
        run: |
          LAT="${{ inputs.lat }}"
          LON="${{ inputs.lon }}"
          ALT="${{ inputs.alt }}"

          LAT=${LAT:-"43.284356"}
          LON=${LON:-"5.358507"}
          ALT=${ALT:-"99.31"}

          python dynamic_multiphysics_engine.py "$LAT" "$LON" "$ALT"

      - name: Validate Generated Files
        run: |
          test -s flux_live.json || (echo "[ERROR] flux_live.json manquant ou vide" && exit 1)
          test -s wasm_astronomie.wasm || (echo "[ERROR] Compilation Wasm échouée" && exit 1)

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flux_live.json wasm_astronomie.js wasm_astronomie.wasm 2>/devnull || true
          if git diff --staged --quiet; then
            echo "Aucune modification à commiter."
          else
            git commit -m "Build Wasm & Update DE440s flux_live.json [skip ci]"
            git push origin main
          fi
