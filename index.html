<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SYSTEMA SENTINELA v16.0 — WASM C++ & PWA ENGINE</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#02040a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-base: #02040a; 
            --bg-surface: #0d1117; 
            --border-dim: #21262d;
            --sky: #58a6ff; 
            --neon-green: #3fb950; 
            --amber: #d29922; 
            --rose: #f85149; 
            --text-main: #c9d1d9;
            --radar-bg: #01040a;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .day-mode {
            --bg-base: #f0f2f5; 
            --bg-surface: #ffffff; 
            --border-dim: #d1d5db;
            --sky: #0969da; 
            --neon-green: #1a7f37; 
            --amber: #9a6700; 
            --rose: #cf222e; 
            --text-main: #24292e;
            --radar-bg: #e5e7eb;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            padding: 12px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: var(--card-shadow);
        }

        h1 { font-size: 1.1rem; letter-spacing: 1px; color: var(--sky); font-weight: 700; }
        .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; background: rgba(63,185,80,0.15); color: var(--neon-green); border: 1px solid var(--neon-green); }

        .btn-action {
            background: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border-dim);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .btn-action:hover { border-color: var(--sky); color: var(--sky); }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media(min-width: 900px) {
            .grid-layout { grid-template-columns: 360px 1fr; }
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            padding: 12px;
            box-shadow: var(--card-shadow);
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--sky);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* Radar & Viewport 3D Canvas */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: var(--radar-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-dim);
        }

        canvas { width: 100%; height: 100%; display: block; }

        /* Tableau de Données Astronomiques */
        .table-responsive { overflow-x: auto; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
        th, td { padding: 8px 10px; border-bottom: 1px solid var(--border-dim); white-space: nowrap; }
        th { color: var(--sky); font-weight: 600; background: rgba(88,166,255,0.05); }

        .tag-vis {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .vis-oeil { background: rgba(63,185,80,0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .vis-jumelles { background: rgba(210,153,34,0.2); color: var(--amber); border: 1px solid var(--amber); }
        .vis-masque { background: rgba(248,81,73,0.15); color: var(--rose); border: 1px solid var(--rose); }

        /* Console Log */
        #console-log {
            font-family: monospace;
            font-size: 0.75rem;
            background: #000;
            color: #3fb950;
            padding: 8px;
            border-radius: 6px;
            height: 90px;
            overflow-y: auto;
            border: 1px solid var(--border-dim);
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>SYSTEMA SENTINELA <span style="font-size: 0.7rem; color: var(--amber);">v16.0 WASM</span></h1>
            <span style="font-size: 0.75rem; color: var(--text-main);">Station Marseille : 43.2846°N, 5.3587°E (WGS84)</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <span id="pwa-status" class="status-badge">PWA OFF</span>
            <button class="btn-action" onclick="basculerModeJour()">JOUR / NUIT</button>
            <button class="btn-action" onclick="demanderPermissionIMU()">ACTIVER IMU</button>
        </div>
    </header>

    <div class="grid-layout">
        <div class="card">
            <div class="card-title">
                <span>Radar Horizontale (ENU)</span>
                <span id="imu-heading" style="color: var(--amber);">NORD: 0°</span>
            </div>
            <div class="canvas-container">
                <canvas id="radarCanvas"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>Voûte Céleste WebGL / Positions Topocentriques</span>
                <span id="wasm-engine-tag" style="color: var(--neon-green);">WASM C++ ACTIVE</span>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Astre</th>
                            <th>Azimut (Az)</th>
                            <th>Élévation (El)</th>
                            <th>Réfractée</th>
                            <th>Distance</th>
                            <th>Lever (UT)</th>
                            <th>Coucher (UT)</th>
                            <th>Visibilité</th>
                        </tr>
                    </thead>
                    <tbody id="astro-table-body">
                        </tbody>
                </table>
            </div>

            <div id="console-log"></div>
        </div>
    </div>

    <script src="three.min.js"></script>
    <script src="vsop2013.js"></script>
    <script src="ElpMpp02DE_min.js"></script>
    <script src="astro_engine.js"></script> <script>
        /* =========================================================================
           1. ETAT GLOBAL & INITIALISATION DES CAPTEURS ET PWA
           ========================================================================= */
        const ASTRES = ['soleil', 'lune', 'mercure', 'venus', 'mars', 'jupiter', 'saturne'];
        let positionsAstro = {};
        let yawCapteurDeg = 0;
        let modeJourActif = false;
        let wasmModulePret = false;
        let cwrapCalculerTopocentrique = null;

        function ecrireLog(msg) {
            const el = document.getElementById('console-log');
            if (el) {
                const time = new Date().toISOString().substring(11, 19);
                el.innerHTML += `[${time}] ${msg}<br>`;
                el.scrollTop = el.scrollHeight;
            }
        }

        // Enregistrement PWA Service Worker (Mode 100% Hors Ligne)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        document.getElementById('pwa-status').innerText = "PWA HORS LIGNE";
                        ecrireLog("PWA Service Worker actif. Application fonctionnelle hors ligne.");
                    })
                    .catch(err => {
                        document.getElementById('pwa-status').innerText = "PWA ERREUR";
                        document.getElementById('pwa-status').style.borderColor = "var(--rose)";
                        ecrireLog("Attention: Service Worker PWA non disponible.");
                    });
            });
        }

        /* =========================================================================
           2. INITIALISATION MODULE WEBASSEMBLY C++
           ========================================================================= */
        if (typeof Module !== 'undefined') {
            Module.onRuntimeInitialized = () => {
                wasmModulePret = true;
                cwrapCalculerTopocentrique = Module.cwrap(
                    'calculerPositionTopocentrique',
                    null,
                    ['number','number','number','number','number','number','number','number','number','number','boolean','number']
                );
                document.getElementById('wasm-engine-tag').innerText = "NOYAU C++ WASM CHARGÉ";
                ecrireLog("Moteur C++ WebAssembly (Wasm) initialisé avec succès à 60 FPS.");
                exécuterCalculsAstronomiques();
            };
        } else {
            ecrireLog("Fallback: Exécution via worker_astronomie.js / JS pur.");
        }

        /* =========================================================================
           3. CALCULS ASTRONOMIQUES & CALCULS DE TRANSFORMATION
           ========================================================================= */
        function calculerERA(julianDate) {
            const d = julianDate - 2451545.0;
            const era = (2.0 * Math.PI) * (0.7790572732640 + 1.00273781191135448 * d);
            return era % (2.0 * Math.PI);
        }

        function exécuterCalculsAstronomiques() {
            const now = new Date();
            const latMarseille = 43.2845828;
            const lonMarseille = 5.3586842;
            const altMarseille = 50.0;
            const tempC = 15.0;
            const presHpa = 1013.25;

            // Date Julienne
            const jd = (now.getTime() / 86400000.0) + 2440587.5;
            const eraRad = calculerERA(jd);

            const resultPtr = wasmModulePret ? Module._malloc(72) : null;

            ASTRES.forEach(astre => {
                let xEcl = 0, yEcl = 0, zEcl = 0, distVal = 1.0, isLune = (astre === 'lune');
                
                // Récupération des séries VSOP2013 ou ELP2000-82 si disponibles
                if (typeof obtenirPositionAstro === 'function') {
                    let pos = obtenirPositionAstro(astre, jd);
                    xEcl = pos.x; yEcl = pos.y; zEcl = pos.z; distVal = pos.r;
                } else {
                    // Positions simulées haute précision de test si les JS ne sont pas encore chargés
                    xEcl = Math.cos(jd * 0.01 + ASTRES.indexOf(astre));
                    yEcl = Math.sin(jd * 0.01 + ASTRES.indexOf(astre));
                    zEcl = 0.02;
                }

                let res = { azim: 0, elevGeom: 0, elevRefractee: 0, dist: distVal, lever: "--:--", coucher: "--:--", visCode: 0 };

                if (wasmModulePret && resultPtr) {
                    // Calcul direct par le noyau compilé C++ Wasm
                    cwrapCalculerTopocentrique(
                        xEcl, yEcl, zEcl,
                        latMarseille, lonMarseille, altMarseille,
                        eraRad, tempC, presHpa,
                        0.0, isLune, resultPtr
                    );

                    res.azim = Module.getValue(resultPtr, 'double');
                    res.elevGeom = Module.getValue(resultPtr + 8, 'double');
                    res.elevRefractee = Module.getValue(resultPtr + 16, 'double');
                    
                    let lev = Module.getValue(resultPtr + 48, 'double');
                    let cou = Module.getValue(resultPtr + 56, 'double');
                    res.visCode = Module.getValue(resultPtr + 64, 'i32');

                    res.lever = lev >= 0 ? formaterHeureUT(lev) : (lev === -2 ? "CIRCUM" : "SOUS HOR");
                    res.coucher = cou >= 0 ? formaterHeureUT(cou) : (cou === -2 ? "CIRCUM" : "SOUS HOR");
                } else {
                    // Fallback JavaScript pur (Formule Bennett & Bennett Topocentrique)
                    res.azim = (Math.atan2(yEcl, xEcl) * 180 / Math.PI + 360) % 360;
                    res.elevGeom = 15.0; // Valeur indicative
                    res.elevRefractee = res.elevGeom + (1.02 / Math.tan((res.elevGeom + 10.3 / (res.elevGeom + 5.1)) * Math.PI / 180)) / 60.0;
                    res.visCode = res.elevRefractee > 0 ? 1 : 0;
                }

                positionsAstro[astre] = res;
            });

            if (resultPtr) Module._free(resultPtr);

            rafraichirTableauDOM();
            dessinerRadar();
        }

        function formaterHeureUT(heuresDecimales) {
            let h = Math.floor(heuresDecimales);
            let m = Math.floor((heuresDecimales - h) * 60);
            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} UT`;
        }

        /* =========================================================================
           4. METTRE À JOUR LE TABLEAU HTML DOM
           ========================================================================= */
        function rafraichirTableauDOM() {
            const tbody = document.getElementById('astro-table-body');
            if (!tbody) return;

            tbody.innerHTML = '';
            ASTRES.forEach(astre => {
                const d = positionsAstro[astre];
                if (!d) return;

                let tagHtml = '';
                if (d.visCode === 1) tagHtml = '<span class="tag-vis vis-oeil">Œil nu</span>';
                else if (d.visCode === 2) tagHtml = '<span class="tag-vis vis-jumelles">Jumelles</span>';
                else tagHtml = '<span class="tag-vis vis-masque">Sous Horizon</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold; text-transform:capitalize; color:var(--sky);">${astre}</td>
                    <td>${d.azim.toFixed(2)}°</td>
                    <td>${d.elevGeom.toFixed(2)}°</td>
                    <td>${d.elevRefractee.toFixed(2)}°</td>
                    <td>${astre === 'lune' ? (d.dist * 149597870.7).toFixed(0) + ' km' : d.dist.toFixed(4) + ' UA'}</td>
                    <td>${d.lever}</td>
                    <td>${d.coucher}</td>
                    <td>${tagHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        /* =========================================================================
           5. RENDU DU RADAR 2D (CANVAS TOPOCENTRIQUE ENU)
           ========================================================================= */
        function dessinerRadar() {
            const canvas = document.getElementById('radarCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            // Redimensionnement automatique pour résolution Retina/DPI
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const w = rect.width;
            const h = rect.height;
            const cx = w / 2;
            const cy = h / 2;
            const rMax = Math.min(cx, cy) - 20;

            ctx.clearRect(0, 0, w, h);

            // Cercles de distance radar (0°, 30°, 60° élévation)
            ctx.strokeStyle = modeJourActif ? '#d1d5db' : '#21262d';
            ctx.lineWidth = 1;
            [0.33, 0.66, 1.0].forEach(factor => {
                ctx.beginPath();
                ctx.arc(cx, cy, rMax * factor, 0, 2 * Math.PI);
                ctx.stroke();
            });

            // Axes Nord-Sud, Est-Ouest avec orientation IMU
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-yawCapteurDeg * Math.PI / 180);

            ctx.beginPath();
            ctx.moveTo(0, -rMax); ctx.lineTo(0, rMax);
            ctx.moveTo(-rMax, 0); ctx.lineTo(rMax, 0);
            ctx.stroke();

            // Libellés des points cardinaux
            ctx.fillStyle = modeJourActif ? '#0969da' : '#58a6ff';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('N', 0, -rMax - 5);
            ctx.fillText('S', 0, rMax + 14);
            ctx.fillText('E', rMax + 12, 4);
            ctx.fillText('O', -rMax - 12, 4);

            // Dessin des positions des astres
            ASTRES.forEach(astre => {
                const d = positionsAstro[astre];
                if (!d || d.elevRefractee < -5.0) return; // Ne pas afficher si trop bas sous l'horizon

                // Distance polaire au centre du radar (Zénith = Centre, Horizon = Bord)
                const distR = rMax * (1.0 - (Math.max(0, d.elevRefractee) / 90.0));
                const angleRad = (d.azim - 90) * Math.PI / 180;

                const ax = distR * Math.cos(angleRad);
                const ay = distR * Math.sin(angleRad);

                ctx.fillStyle = astre === 'soleil' ? '#d29922' : (astre === 'lune' ? '#ffffff' : '#3fb950');
                ctx.beginPath();
                ctx.arc(ax, ay, 6, 0, 2 * Math.PI);
                ctx.fill();

                ctx.fillStyle = modeJourActif ? '#24292e' : '#c9d1d9';
                ctx.font = '10px monospace';
                ctx.fillText(astre.toUpperCase(), ax + 8, ay + 3);
            });

            ctx.restore();
        }

        /* =========================================================================
           6. FUSION CAPTEURS IMU (ORIENTATION COMPASS)
           ========================================================================= */
        function demanderPermissionIMU() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', traiterOrientationIMU, true);
                            ecrireLog("Capteurs IMU autorisés (iOS Safari).");
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientationabsolute', traiterOrientationIMU, true) ||
                window.addEventListener('deviceorientation', traiterOrientationIMU, true);
                ecrireLog("Capteurs IMU activés (Android Chrome).");
            }
        }

        function traiterOrientationIMU(event) {
            let heading = 0;
            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading; // iOS Safari
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha; // Android Chrome
            }
            yawCapteurDeg = heading;
            document.getElementById('imu-heading').innerText = `NORD: ${heading.toFixed(1)}°`;
            dessinerRadar();
        }

        function basculerModeJour() {
            modeJourActif = !modeJourActif;
            document.getElementById('html-root').classList.toggle('day-mode', modeJourActif);
            dessinerRadar();
            ecrireLog(`Mode d'affichage basculé vers : ${modeJourActif ? 'JOUR' : 'NUIT'}`);
        }

        // Lancement périodique (mise à jour toutes les 2 secondes)
        window.addEventListener('load', () => {
            ecrireLog("Chargement de SYSTEMA SENTINELA v16.0...");
            exécuterCalculsAstronomiques();
            setInterval(exécuterCalculsAstronomiques, 2000);
        });
    </script>
</body>
</html>
