<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SYSTEMA SENTINELA v18.2 — GALAXY S21 ULTRA / VSOP2013 INTÉGRAL</title>
    <style>
        :root {
            --bg-base: #02040a; --bg-surface: #0d1117; --border-dim: #21262d;
            --sky: #58a6ff; --neon-green: #3fb950; --amber: #d29922; --rose: #f85149; --text-main: #c9d1d9;
            --dec1: #ff5733; --dec2: #2ecc71; --dec3: #3498db; --dec4: #9b59b6; --dec5: #7f8c8d; 
            --radar-bg: #01040a;
        }
        .day-mode {
            --bg-base: #f0f2f5; --bg-surface: #ffffff; --border-dim: #d1d5db;
            --sky: #0969da; --neon-green: #1a7f37; --amber: #9a6700; --rose: #cf222e; --text-main: #24292e;
            --dec1: #bc4c00; --dec2: #1a7f37; --dec3: #0969da; --dec4: #8250df; --dec5: #57606a;
            --radar-bg: #e6edf3;
        }
        body {
            background: var(--bg-base); color: var(--text-main);
            font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; padding: 10px; margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .master-header {
            background: var(--bg-surface); border: 1px solid var(--border-dim);
            border-left: 4px solid var(--sky); padding: 10px 15px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
        }
        .brand { font-size: 12px; font-weight: bold; letter-spacing: 0.5px; }
        .status-badge { padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 9.5px; }
        .badge-ok { background: rgba(63,185,80,0.15); color: var(--neon-green); border: 1px solid var(--neon-green); }
        
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 1100px) { .grid-layout { grid-template-columns: 320px 1fr; } }
        
        .panel { background: var(--bg-surface); border: 1px solid var(--border-dim); border-radius: 6px; padding: 12px; }
        .panel-title { border-bottom: 1px solid var(--border-dim); padding-bottom: 6px; margin-top: 0; margin-bottom: 10px; font-size: 11.5px; color: var(--sky); display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th, td { padding: 7px 8px; border-bottom: 1px solid var(--border-dim); font-size: 10px; }
        th { color: var(--sky); font-weight: normal; background: rgba(88,166,255,0.05); }
        
        .d-int { color: var(--text-main); font-weight: bold; }
        .d-p1 { color: var(--dec1); font-weight: bold; }
        .d-p2 { color: var(--dec2); font-weight: bold; }
        .d-p3 { color: var(--dec3); }
        .d-p4 { color: var(--dec4); }
        .d-p5 { color: var(--dec5); }

        .btn-action { background: var(--border-dim); color: var(--text-main); border: 1px solid var(--sky); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 10px; }
        .btn-action:hover { background: var(--sky); color: var(--bg-base); }

        .log-console { background: #000; color: #8b949e; border: 1px solid var(--border-dim); height: 80px; overflow-y: auto; padding: 8px; border-radius: 4px; margin-top: 10px; font-size: 9.5px; font-family: monospace; }
        #radarCanvas { width: 100%; max-width: 280px; height: auto; aspect-ratio: 1; display: block; margin: 0 auto; background: var(--radar-bg); border-radius: 50%; border: 1px solid var(--border-dim); }
    </style>
    <script src="vsop2013.js"></script>
</head>
<body>
<div class="container">
    <header class="master-header">
        <div class="brand">SYSTEMA SENTINELA v18.2 — STATION TERRAIN</div>
        <div>UTC ATOMIQUE : <span id="lbl-epoch" style="color:var(--amber); font-weight: bold;">SYNCHRONISATION...</span></div>
        <div style="display:flex; gap:6px;">
            <button class="btn-action" onclick="basculerModeJour()">MODE JOUR/NUIT</button>
            <span id="source-badge" class="status-badge badge-ok">ACTIF</span>
        </div>
    </header>

    <div class="grid-layout">
        <div class="panel" style="display:flex; flex-direction:column; align-items:center;">
            <h3 class="panel-title" style="width:100%;">PROJECTION RADAR VRAI NORD</h3>
            <canvas id="radarCanvas" width="280" height="280"></canvas>
            <div style="margin-top:8px; font-size:9.5px; color:var(--sky);" id="lbl-orientation">CAP IMU : 0.0° (Nord)</div>
        </div>

        <div class="panel" style="overflow-x: auto;">
            <h3 class="panel-title">
                <span>ÉPHÉMÉRIDES TOPOCENTRIQUES & ANALYSE OPTIQUE</span>
                <span id="lbl-coord-ref" style="font-size:9px; color:var(--amber);">GPS : 43.284N, 5.358E</span>
            </h3>
            <table>
                <thead>
                    <tr>
                        <th>ASTRE</th>
                        <th>AZIMUT</th>
                        <th>ÉLÉVATION</th>
                        <th>DISTANCE</th>
                        <th>OEIL NU</th>
                        <th>JUMELLES</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="logConsole" class="log-console"></div>
</div>

<script>
    const ASTRES = ['mercure', 'venus', 'mars', 'jupiter', 'saturne', 'uranus', 'neptune', 'soleil', 'lune'];
    const MAGNITUDES = { mercure: 0.2, venus: -4.2, mars: 1.0, jupiter: -2.2, saturne: 0.5, uranus: 5.7, neptune: 7.8, soleil: -26.7, lune: -12.5 };
    const WGS84 = { a: 6378137.0, f: 1.0 / 298.257223563, get e2() { return this.f * (2.0 - this.f); } };
    
    let station3D = { lat: 43.284636, lon: 5.358780, altGps: 100.0, X_itrs: 0, Y_itrs: 0, Z_itrs: 0 };
    let yawDeg = 0.0;
    let modeJourActif = false;
    let positionsCache = {};

    const tbody = document.getElementById('table-body');
    ASTRES.forEach(a => {
        tbody.innerHTML += `
            <tr id="row-${a}">
                <td style="font-weight:bold; color:var(--sky);">${a.toUpperCase()}</td>
                <td id="az-${a}" style="font-family:monospace;">--</td>
                <td id="el-${a}" style="font-family:monospace;">--</td>
                <td id="dist-${a}" style="font-family:monospace;">--</td>
                <td id="oeil-${a}">--</td>
                <td id="jum-${a}">--</td>
            </tr>`;
    });

    function ecrireLog(m) {
        const c = document.getElementById('logConsole');
        if(c) {
            c.innerHTML += `[${new Date().toISOString().slice(11, 19)}] ${m}<br>`;
            c.scrollTop = c.scrollHeight;
        }
    }

    function basculerModeJour() {
        modeJourActif = !modeJourActif;
        document.getElementById('html-root').classList.toggle('day-mode', modeJourActif);
        ecrireLog(`[UI] Bascule affichage : ${modeJourActif ? 'MODE JOUR' : 'MODE NUIT'}`);
    }

    function formaterChiffreCouleur(valeur) {
        if(isNaN(valeur)) return "--";
        const str = Math.abs(valeur).toFixed(5);
        const parts = str.split('.');
        const entier = (valeur < 0 ? '-' : '') + parts[0];
        const dec = (parts[1] || "00000").padEnd(5, "0");
        return `<span class="d-int">${entier}</span>.<span class="d-p1">${dec[0]}</span><span class="d-p2">${dec[1]}</span><span class="d-p3">${dec[2]}</span><span class="d-p4">${dec[3]}</span><span class="d-p5">${dec[4]}</span>`;
    }

    function actualiserVecteurStationITRS() {
        const phi = station3D.lat * Math.PI / 180.0, lambda = station3D.lon * Math.PI / 180.0, h = station3D.altGps;
        const N = WGS84.a / Math.sqrt(1.0 - WGS84.e2 * Math.sin(phi) * Math.sin(phi));
        station3D.X_itrs = (N + h) * Math.cos(phi) * Math.cos(lambda);
        station3D.Y_itrs = (N + h) * Math.cos(phi) * Math.sin(lambda);
        station3D.Z_itrs = (N * (1.0 - WGS84.e2) + h) * Math.sin(phi);
    }

    function connecterCapteursMateriels() {
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientationabsolute', (event) => {
                if (event.alpha !== null) {
                    yawDeg = 360.0 - event.alpha;
                    const lbl = document.getElementById('lbl-orientation');
                    if(lbl) lbl.innerText = `CAP IMU : ${yawDeg.toFixed(1)}°`;
                }
            }, true);
        }
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                station3D.lat = pos.coords.latitude;
                station3D.lon = pos.coords.longitude;
                station3D.altGps = pos.coords.altitude || 100.0;
                actualiserVecteurStationITRS();
                const ref = document.getElementById('lbl-coord-ref');
                if(ref) ref.innerText = `GPS : ${station3D.lat.toFixed(3)}N, ${station3D.lon.toFixed(3)}E`;
            }, (err) => {
                ecrireLog("[GPS] Utilisation position de secours par défaut.");
            }, { enableHighAccuracy: true });
        }
    }

    function dessinerRadar() {
        const canvas = document.getElementById('radarCanvas');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2, cy = canvas.height / 2, rMax = cx - 15;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = modeJourActif ? '#949b84' : '#21262d';
        ctx.lineWidth = 1;
        
        [0.5, 1.0].forEach(scale => {
            ctx.beginPath(); ctx.arc(cx, cy, rMax * scale, 0, 2 * Math.PI); ctx.stroke();
        });
        ctx.beginPath(); ctx.moveTo(cx, cy - rMax); ctx.lineTo(cx, cy + rMax); ctx.moveTo(cx - rMax, cy); ctx.lineTo(cx + rMax, cy); ctx.stroke();

        ctx.fillStyle = 'var(--sky)'; ctx.font = '9px monospace';
        [{ label: "N", angle: 0 }, { label: "E", angle: 90 }, { label: "S", angle: 180 }, { label: "O", angle: 270 }].forEach(pt => {
            let theta = (pt.angle - yawDeg - 90) * Math.PI / 180.0;
            ctx.fillText(pt.label, cx + (rMax + 5) * Math.cos(theta) - 3, cy + (rMax + 5) * Math.sin(theta) + 3);
        });

        for (const astre in positionsCache) {
            const data = positionsCache[astre];
            if (data.el > 0) {
                const r = rMax * (1.0 - data.el / 90.0);
                const theta = (data.az - yawDeg - 90) * Math.PI / 180.0;
                ctx.fillStyle = astre === 'soleil' ? 'var(--amber)' : astre === 'lune' ? (modeJourActif ? '#000' : '#fff') : 'var(--sky)';
                ctx.beginPath(); ctx.arc(cx + r * Math.cos(theta), cy + r * Math.sin(theta), 3.5, 0, 2 * Math.PI); ctx.fill();
            }
        }
    }

    function bouclePrincipale() {
        const maintenant = Date.now();
        const jd = (maintenant / 86400000.0) + 2440587.5;
        const T = (jd - 2451545.0) / 36525.0;

        const lblEpoch = document.getElementById('lbl-epoch');
        if(lblEpoch) lblEpoch.innerText = new Date(maintenant).toISOString();

        if (typeof vsop2013 === 'undefined') {
            ecrireLog("[ERREUR] vsop2013.js non chargé.");
            requestAnimationFrame(bouclePrincipale);
            return;
        }

        const lat_rad = station3D.lat * Math.PI / 180.0, lon_rad = station3D.lon * Math.PI / 180.0;
        const cosLat = Math.cos(lat_rad), sinLat = Math.sin(lat_rad);
        const cosLon = Math.cos(lon_rad), sinLon = Math.sin(lon_rad);

        let posTerre = { x: 0, y: 0, z: 0 };
        if (vsop2013.terre && typeof vsop2013.terre.position === 'function') {
            let pT = vsop2013.terre.position(T);
            posTerre = { x: pT.x * 149597870700.0, y: pT.y * 149597870700.0, z: pT.z * 149597870700.0 };
        }

        ASTRES.forEach(astre => {
            if (vsop2013[astre] && typeof vsop2013[astre].position === 'function') {
                let pA = vsop2013[astre].position(T);
                let posX = pA.x * 149597870700.0, posY = pA.y * 149597870700.0, posZ = pA.z * 149597870700.0;
                let topoX = (astre === 'soleil' ? -posTerre.x : posX - posTerre.x) - station3D.X_itrs;
                let topoY = (astre === 'soleil' ? -posTerre.y : posY - posTerre.y) - station3D.Y_itrs;
                let topoZ = (astre === 'soleil' ? -posTerre.z : posZ - posTerre.z) - station3D.Z_itrs;
                let dist = Math.sqrt(topoX*topoX + topoY*topoY + topoZ*topoZ);

                let comp_Est = topoX * (-sinLon) + topoY * cosLon;
                let comp_Nord = topoX * (-sinLat * cosLon) + topoY * (-sinLat * sinLon) + topoZ * cosLat;
                let comp_Zen = topoX * (cosLat * cosLon) + topoY * (cosLat * sinLon) + topoZ * sinLat;

                let el = Math.asin(comp_Zen / dist) * 180.0 / Math.PI;
                let az = (Math.atan2(comp_Est, comp_Nord) * 180.0 / Math.PI + 360.0) % 360.0;

                positionsCache[astre] = { az, el };

                const azEl = document.getElementById(`az-${astre}`);
                const elEl = document.getElementById(`el-${astre}`);
                const distEl = document.getElementById(`dist-${astre}`);
                const oeilEl = document.getElementById(`oeil-${astre}`);
                const jumEl = document.getElementById(`jum-${astre}`);

                if (azEl) azEl.innerHTML = formaterChiffreCouleur(az);
                if (elEl) elEl.innerHTML = formaterChiffreCouleur(el);
                if (distEl) distEl.innerText = (dist / 149597870700.0).toFixed(4) + " UA";

                let mag = MAGNITUDES[astre] || 5.0;
                if (oeilEl) {
                    oeilEl.innerText = mag <= 3.0 ? "OUI" : "NON";
                    oeilEl.style.color = mag <= 3.0 ? "var(--neon-green)" : "var(--rose)";
                }
                if (jumEl) {
                    jumEl.innerText = mag <= 7.0 ? "OUI" : "NON";
                    jumEl.style.color = mag <= 7.0 ? "var(--sky)" : "var(--rose)";
                }
            }
        });

        dessinerRadar();
        requestAnimationFrame(bouclePrincipale);
    }

    window.addEventListener('load', () => {
        actualiserVecteurStationITRS();
        connecterCapteursMateriels();
        ecrireLog("[SYSTEMA] Moteur intégré v18.2 actif sur S21 Ultra.");
        requestAnimationFrame(bouclePrincipale);
    });
</script>
</body>
</html>
